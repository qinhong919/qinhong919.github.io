<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>探索档案｜老道覃宏</title><meta name="description" content="老道覃宏的活动、观察、作品与合作资料档案。"><link rel="stylesheet" href="../p.css"></head><body data-content-root="../../content-public"><header class="p-header"><div class="p-shell p-nav"><a class="p-brand" href="../">老道覃宏 <small>个人探索档案</small></a><button class="p-menu" type="button" data-p-menu>菜单</button><nav class="p-nav-links" data-p-nav><a href="../../shoushenji/">收神记</a><a href="../">老道</a><a href="../observations/">东方生命观察</a><a href="../observations/?category=观察方法与未知观察">未知观察</a><a href="../films/">探索影像</a><a href="../archive/">探索档案</a></nav></div></header><main><section class="p-page-hero"><div class="p-shell"><p class="p-kicker">探索档案</p><h1>让过程留下，<br>让理解能够回看。</h1><p>这里将持续收录人物年表、公开活动、探索记录、内容作品、媒体资料与合作资料。首发版本只呈现已收录、待公开复核的结构化记录。</p></div></section><section class="p-page-main"><div class="p-shell"><div class="p-archive-grid" data-archive></div><div class="p-manifesto-body" style="margin-top:70px"><p>探索档案的价值，不在于堆积证明，而在于让每一项公开内容都能回到它的时间、来源、现场和边界。只有过程可被看见，长期探索才不会被压缩成一句结论。</p><p>公开前，人物资料、活动记录、影像授权、场地信息与内容性质均须逐项复核。</p></div></div></section></main><footer class="p-footer"><div class="p-shell p-footer-inner"><div><strong>探索档案</strong><p>面对传统保持敬畏；面对未知保持开放；面对事实坚持记录；面对经验等待验证。</p></div><nav class="p-footer-nav"><a href="../">个人档案</a><a href="../observations/">东方生命观察</a></nav></div></footer><script src="../p.js"></script></body></html>
