<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>祝眠｜今晚先别急着选声音</title>
<link rel="stylesheet" href="triage.css">
</head>
<body>
<main class="shell">
<header><a href="./">祝眠</a><span id="progress"></span></header>
<section id="app" aria-live="polite"></section>
<footer>祝眠是睡眠习惯辅助工具，不替代医疗诊断或专业帮助。</footer>
</main>
<script src="https://cdn.jsdelivr.net/gh/qinhong919/qinhong919.github.io@e09aee2b52b59897b8933c827ebf51d97ba4e7ce/zhumian/triage.js"></script>
<script>
(function () {
  result = function () {
    var m = state.result || decide(state.a);
    state.result = m;
    save();
    if (!silent(m, state.a)) goPlay();
    else quiet();
  };
  var oldQuiet = quiet;
  quiet = function () {
    var pack = COPY[state.result] || ["\u4eca\u665a\u4e0d\u542f\u52a8\u97f3\u9891", "", false];
    var p1 = state.a && state.a.apnea === "yes";
    progress.textContent = "\u8fdb\u884c\u4e2d";
    app.innerHTML = '<div class="result"><div class="tag">\u4eca\u665a\u65b9\u6848\u5df2\u5f00\u59cb</div><h2>' + pack[0] + "</h2>" +
      (p1 ? '<div class="warning">\u5b89\u5168\u63d0\u793a\u4fdd\u6301\u6709\u6548\u3002\u4e0d\u63d0\u4f9b\u7528\u58f0\u97f3\u76d6\u4f4f\u9f3e\u58f0\u3002</div>' : "") +
      "<p>" + pack[1] + "</p><p class=\"small\">\u4eca\u665a\u4e0d\u653e\u97f3\u3002\u628a\u5c4f\u5e55\u6263\u4e0a\u5373\u53ef\u3002\u65e9\u4e0a\u518d\u8bb0\u4e09\u9879\u3002</p>" +
      '<button class="button" id="stop">\u7ed3\u675f\u4eca\u665a</button></div>';
    document.querySelector("#stop").onclick = home;
  };
  var oldHome = home;
  home = function () {
    if (state.result && (state.nights || []).length >= 7) {
      showVerdict();
      return;
    }
    oldHome();
  };
  var oldSave = saveLog;
  saveLog = function () {
    if ((state.nights || []).length >= 7) {
      showVerdict();
      return;
    }
    oldSave();
  };
  home();
})();
</script>
</body>
</html>
